name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # One source of truth for the version, so CI cannot drift from the
          # module.
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Unit tests
        run: go test -race ./...

      - name: Start the test directory
        run: docker compose -f test/integration/docker-compose.yml up -d --wait

      - name: Integration tests
        run: go test -tags=integration ./test/integration/... -v

      - name: Stop the test directory
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Compiling on all three catches a platform-specific import — go-keyring
      # has a different backend on each — before plan 2 starts packaging.
      - run: go build ./...
