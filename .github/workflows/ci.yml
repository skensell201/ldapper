name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # One source of truth for the version, so CI cannot drift from the
          # module.
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Lint
        # v8 of the action is the one that runs the golangci-lint v2 line.
        # v6 installs v1, which is built against an older Go than this module
        # targets and refuses to load the config at all.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Unit tests
        run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The bindings are generated from the Go types and deliberately not
      # committed. The frontend imports them, so they have to exist before it
      # can be type-checked or tested — and generating them here also proves
      # the generator still runs.
      - name: Generate the TypeScript bindings
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          wails generate module

      - name: Frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Start the test directory
        run: docker compose -f test/integration/docker-compose.yml up -d --wait

      - name: Integration tests
        run: go test -tags=integration ./test/integration/... -v

      - name: Stop the test directory
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Compiling on all three catches a platform-specific import — go-keyring
      # has a different backend on each — before plan 2 starts packaging.
      - run: go build ./...
