name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            # A universal binary runs on both Apple silicon and Intel, so
            # there is one macOS download rather than two.
            artifact: Ldapper-macos-universal
          - os: windows-latest
            platform: windows/amd64
            artifact: Ldapper-windows-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          # Zip the bundle rather than the bare binary: an .app is a
          # directory, and downloading one any other way loses its structure.
          ditto -c -k --keepParent Ldapper.app ../../${{ matrix.artifact }}.zip

      - name: Package Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/bin/Ldapper.exe -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*.zip \
            --title "Ldapper ${{ github.ref_name }}" \
            --notes-file .github/RELEASE_NOTES.md
